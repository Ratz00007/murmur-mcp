name: Release

# Publishes murmur-mcp to npm when a GitHub release is published (or on
# demand). Publishes are gated behind the full CI matrix: the release is only
# shipped if unit + golden + e2e tests and the cleanroom gate are green.
#
# One-time setup:
#   1. Set the NPM_TOKEN secret (automation access token from npmjs.com).
#   2. Point `repository`/`homepage`/`bugs` in murmur/packages/server/package.json
#      at the real GitHub repo (they ship in the npm metadata).

on:
  release:
    types: [published]
  workflow_dispatch:

defaults:
  run:
    working-directory: murmur

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: murmur/package-lock.json
          registry-url: https://registry.npmjs.org
      - name: Verify release version
        shell: bash
        run: |
          package_version="$(node -p "require('./packages/server/package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "::error::Release tag v${tag_version} does not match package version ${package_version}"
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:e2e
      - run: npm run cleanroom
      - name: Pack
        run: npm pack --pack-destination release-artifacts -w murmur-mcp
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: murmur/release-artifacts/*.tgz
      - name: Publish to npm
        run: npm publish --access public --provenance -w murmur-mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
