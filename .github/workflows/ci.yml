name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: murmur

jobs:
  quality:
    name: Lint + typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: murmur/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint

  tests:
    name: Unit + golden + e2e + cleanroom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: murmur/package-lock.json
      - run: npm ci
      - run: npm run test          # unit + golden
      - run: npm run test:e2e     # end-to-end (real SDK client ↔ server over stdio)
      - run: npm run cleanroom    # zero-egress gate
      # Cross-Node determinism (E6): the same seed must produce the same bytes.
      # Runs from the repo root: the script resolves everything from its own
      # path, but the `tools/` directory only exists at root.
      - name: Golden hash must match the committed value
        run: node tools/golden-hash.mjs
        working-directory: ${{ github.workspace }}

  gates:
    name: Claims + hygiene gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: murmur/package-lock.json
      - run: npm ci
      # Every advertised count and tool total must match the measured surface.
      # A present-tense claim that disagrees fails the build (see
      # tools/verify-claims.mjs for how counts are measured).
      - name: Fail if any advertised count or tool total is wrong
        run: node tools/verify-claims.mjs
        working-directory: ${{ github.workspace }}
      # AGENTS.md / CLAUDE.md carry absolute Obsidian-vault paths and a
      # cross-agent ledger about other projects; even though they are
      # gitignored, this guard makes it impossible for a force-add or a
      # rewrite of .gitignore to leak them into the public repo.
      - name: Forbid tracking of local agent contract files
        run: |
          if git ls-files | grep -E '(^|/)AGENTS\.md$|(^|/)CLAUDE\.md$'; then
            echo "::error::AGENTS.md/CLAUDE.md must never be tracked (local paths)"
            exit 1
          fi
          echo "OK: no AGENTS.md / CLAUDE.md in the index"
        working-directory: ${{ github.workspace }}
      # Guards the published gallery against drift: a committed report must be
      # current and every citation must resolve.
      - name: Check published gallery is current
        run: node tools/host-llm-run/check-gallery.mjs
        working-directory: ${{ github.workspace }}
